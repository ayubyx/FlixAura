name: fixaura
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.2

dependencies:
  carousel_slider: ^5.0.0
  flutter:
    sdk: flutter
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: 'GeneralSans'
      fonts:
        - asset : assets/fonts/GeneralSans-Regular.otf  
        - asset : assets/fonts/GeneralSans-Semibold.otf  
        - asset : assets/fonts/GeneralSans-Bold.otf
    - family: 'Chillax'
      fonts:
        - asset : assets/fonts/Chillax-Regular.otf  
        - asset : assets/fonts/Chillax-Semibold.otf  
        - asset : assets/fonts/Chillax-Bold.otf    

          
